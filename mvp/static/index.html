<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Intelligence Assistant — Pixels to Action</title>
<style>
  :root{
    --bg:#0b0b10; --panel:#12121a; --panel2:#171721; --fg:#f4f4f7; --dim:#9aa0b4;
    --line:#262a3a; --a:#a100ff; --a2:#7f5bff; --ok:#22c99b; --warn:#ffb020; --bad:#ff5c6c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}

  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;font-weight:750;letter-spacing:-.01em}
  header .flow{font-size:11.5px;color:var(--dim)}
  header .flow b{color:var(--a2)}
  header .spacer{flex:1}
  .stat{font-size:11.5px;color:var(--dim)}
  .stat b{color:var(--fg)}

  main{display:grid;grid-template-columns:252px minmax(420px,1fr) minmax(360px,1.05fr);height:calc(100vh - 49px)}
  .col{overflow-y:auto;padding:14px;min-width:0}
  .col+.col{border-left:1px solid var(--line)}
  .col::-webkit-scrollbar{width:9px}
  .col::-webkit-scrollbar-thumb{background:#2b2b3a;border-radius:9px}

  h2.t{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--a2);margin:0 0 9px}
  h2.t+h2.t,.col>h2.t:not(:first-child){margin-top:20px}

  .doc{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;background:var(--panel);cursor:pointer;transition:.12s}
  .doc:hover{border-color:#3a3f55}
  .doc.sel{border-color:var(--a);background:#19101f}
  .doc .n{font-size:12.5px;font-weight:650;line-height:1.3}
  .doc .m{font-size:10.5px;color:var(--dim);margin-top:3px}
  .badge{display:inline-block;font-size:9.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-top:5px;margin-right:4px}
  .badge.ok{background:#123a2e;color:#6ee7bf} .badge.bad{background:#3d1620;color:#ff9aa6}
  .badge.warn{background:#3a2c0e;color:#ffd083} .badge.info{background:#1d1d2b;color:var(--dim)}

  .q{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font:inherit;resize:none;outline:none}
  .q:focus{border-color:var(--a)}
  .ask{background:linear-gradient(135deg,var(--a),var(--a2));border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px;margin-top:8px}
  .ask:disabled{opacity:.5;cursor:default}
  .sugg{display:flex;flex-direction:column;gap:5px;margin-top:11px}
  .sugg button{text-align:left;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11.5px;color:var(--dim);background:var(--panel);line-height:1.35}
  .sugg button:hover{border-color:var(--a2);color:var(--fg)}
  .sugg button i{font-style:normal;color:var(--a2);font-weight:750;font-size:10px;letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:2px}

  .status{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:7px}
  .status.answered{background:#123a2e;color:#6ee7bf}
  .status.answered_with_caveat{background:#3a2c0e;color:#ffd083}
  .status.abstained{background:#3d1620;color:#ff9aa6}
  .status.error{background:#3d1620;color:#ff9aa6}
  .status.refused_by_policy{background:#3d1620;color:#ff9aa6}

  .gate{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;
        padding:7px 10px;margin-top:10px;font-size:11.5px;background:var(--panel2)}
  .gate .k{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
           padding:2px 7px;border-radius:5px;white-space:nowrap}
  .gate.allowed .k{background:#123a2e;color:#6ee7bf}
  .gate.allowed_with_obligations .k{background:#3a2c0e;color:#ffd083}
  .gate.refused .k{background:#3d1620;color:#ff9aa6}
  .gate .d{color:var(--dim);line-height:1.4}
  .arts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .arts span{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--dim)}

  .answer{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--panel);margin-top:12px}
  .answer .body{font-size:14.5px;line-height:1.6;margin-top:11px;white-space:pre-wrap}
  .claim{border:1px solid var(--line);border-left:3px solid var(--a2);border-radius:8px;padding:8px 10px;margin-top:7px;background:var(--panel2);cursor:pointer;transition:.12s}
  .claim:hover{border-color:var(--a2);background:#1b1726}
  .claim.sel{border-color:var(--a);background:#1d1226}
  .claim.drop{border-left-color:var(--bad);opacity:.78}
  .claim .tx{font-size:12.5px;line-height:1.45}
  .claim .q2{font-size:11px;color:var(--dim);margin-top:5px;border-left:2px solid #333a4d;padding-left:7px;font-style:italic}
  .claim .cite{font-size:10px;color:var(--a2);margin-top:5px;font-weight:650}
  .claim .vr{font-size:10.5px;color:#ff9aa6;margin-top:4px}

  .note{border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-top:9px;font-size:12px;line-height:1.5}
  .note.bad{border-color:#5a2230;background:#1d1116;color:#ffc3ca}
  .note.warn{border-color:#5a4418;background:#1c160c;color:#ffe0ad}
  .note.ok{border-color:#1d4a3b;background:#0e1a16;color:#a8f0d6}
  .note b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;opacity:.85}

  /* evidence viewer */
  .viewer{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;position:relative}
  .viewer img{display:block;width:100%}
  .hl{position:absolute;border:2.5px solid var(--a);background:#a100ff26;box-shadow:0 0 0 9999px #000000a6;border-radius:3px;transition:.18s}
  .crop{border:1px solid var(--a);border-radius:9px;overflow:hidden;background:#fff;margin-bottom:10px}
  .crop img{display:block;width:100%}
  .caption{font-size:10.5px;color:var(--dim);margin:6px 0 2px}

  table.kv{width:100%;border-collapse:collapse;font-size:11.5px}
  table.kv td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table.kv td:first-child{color:var(--dim);width:42%}
  table.kv td.v{font-family:ui-monospace,Menlo,monospace}
  .cf{color:var(--ok)} .cf.low{color:var(--warn)} .cf.bad{color:var(--bad)}

  .trace{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .trace span{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--dim)}
  .trace span b{color:var(--a2)}

  .spin{display:inline-block;width:12px;height:12px;border:2px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .muted{color:var(--dim);font-size:12px;line-height:1.55}
  .pulse{animation:pl 1.3s ease-in-out infinite}
  @keyframes pl{50%{opacity:.55}}
</style>
</head>
<body>

<header>
  <h1>Document Intelligence Assistant</h1>
  <span class="flow">Document <b>→</b> Understanding <b>→</b> Reasoning <b>→</b> Evidence <b>→</b> Action</span>
  <span class="spacer"></span>
  <span class="stat" id="stat"></span>
</header>

<main>
  <!-- documents -->
  <div class="col">
    <h2 class="t">Corpus</h2>
    <div id="docs"><div class="muted">loading…</div></div>
    <h2 class="t">Cross-document checks</h2>
    <div id="xdoc"><div class="muted">—</div></div>
  </div>

  <!-- ask + answer -->
  <div class="col">
    <h2 class="t">Ask the corpus</h2>
    <textarea class="q" id="q" rows="2" placeholder="Ask anything about these documents…"></textarea>
    <button class="ask" id="go">Ask</button>
    <div class="sugg" id="sugg"></div>
    <div id="out"></div>
  </div>

  <!-- evidence -->
  <div class="col">
    <h2 class="t">Evidence</h2>
    <div id="ev"><div class="muted">Ask a question, then click any claim to see exactly where it was read from.</div></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DOCS = [], SEL = new Set(), LAST = null;

const SUGGESTIONS = [
  ["Lookup — structured path",   "¿Cuál es el IBAN de la cuenta del extracto bancario?"],
  ["Infer — clause reasoning",   "¿Existe penalización por amortización anticipada del préstamo? ¿De cuánto y durante cuánto tiempo?"],
  ["Compare — finds a defect",   "¿Coincide la cuota mensual entre el contrato de préstamo y la escritura notarial?"],
  ["Aggregate — needs maths",    "¿Cuánto se pagó en comisiones en julio y qué porcentaje representa sobre el total de cargos del periodo?"],
  ["Unanswerable — must abstain","¿Cuál es el número de teléfono de contacto de la titular?"],
  ["EU AI Act — refused at the gate","¿Cuál es la etnia de la titular según los documentos?"],
  ["EU AI Act — high-risk, human required","Evalúa la solvencia de la titular para concederle un nuevo crédito"],
];

// ------------------------------------------------------------------ corpus ---
async function loadDocs(){
  const r = await (await fetch('/api/documents')).json();
  DOCS = r.documents || [];
  $('#docs').innerHTML = DOCS.length ? DOCS.map(d => `
    <div class="doc" data-id="${esc(d.doc_id)}">
      <div class="n">${esc(d.name || d.doc_id)}</div>
      <div class="m">${esc(d.doc_type)} · ${esc(d.language||'?')} · ${d.fields} fields</div>
      <span class="badge ${d.failed_checks? 'bad':'ok'}">${d.failed_checks? d.failed_checks+' check'+(d.failed_checks>1?'s':'')+' failed':'validated'}</span>
      <span class="badge info">q ${Number(d.quality||0).toFixed(2)}</span>
    </div>`).join('')
    : `<div class="muted">No documents ingested.<br>Run <code>python3 pipeline.py --reset</code></div>`;
  $('#docs').querySelectorAll('.doc').forEach(el => el.onclick = () => {
    const id = el.dataset.id;
    SEL.has(id) ? SEL.delete(id) : SEL.add(id);
    el.classList.toggle('sel', SEL.has(id));
    showDocument(id);
  });
  $('#stat').innerHTML = `<b>${DOCS.length}</b> documents · <b>${DOCS.reduce((a,d)=>a+d.fields,0)}</b> fields indexed`;
}

async function loadCross(){
  const r = await (await fetch('/api/crossdoc')).json();
  const f = r.findings || [];
  $('#xdoc').innerHTML = f.length ? f.map(x => `
    <div class="note ${x.ok?'ok':'bad'}" style="font-size:11.5px">
      <b>${x.ok?'consistent':'inconsistency'} · ${esc(x.field)}</b>${esc(x.detail)}
    </div>`).join('') : '<div class="muted">—</div>';
}

// --------------------------------------------------------------- questions ---
$('#sugg').innerHTML = SUGGESTIONS.map(([k,q]) =>
  `<button data-q="${esc(q)}"><i>${esc(k)}</i>${esc(q)}</button>`).join('');
$('#sugg').querySelectorAll('button').forEach(b => b.onclick = () => { $('#q').value = b.dataset.q; ask(); });
$('#go').onclick = ask;
$('#q').addEventListener('keydown', e => { if(e.key==='Enter' && (e.metaKey||e.ctrlKey||!e.shiftKey)){ e.preventDefault(); ask(); }});

async function ask(){
  const question = $('#q').value.trim();
  if(!question) return;
  $('#go').disabled = true;
  $('#out').innerHTML = `<div class="answer"><span class="status answered pulse"><span class="spin"></span> planning → retrieving → reading → verifying</span>
    <div class="muted" style="margin-top:9px">The orchestrator is choosing a route, gathering evidence, and the verifier will gate the answer before you see it.</div></div>`;
  $('#ev').innerHTML = '<div class="muted pulse">waiting for evidence…</div>';
  try{
    const body = {question}; if(SEL.size) body.doc_ids = [...SEL];
    const r = await (await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    LAST = r; renderAnswer(r);
  }catch(e){
    $('#out').innerHTML = `<div class="answer"><span class="status error">error</span><div class="body">${esc(e.message||e)}</div></div>`;
  }
  $('#go').disabled = false;
}

function renderAnswer(r){
  if(r.error){ $('#out').innerHTML = `<div class="answer"><span class="status error">error</span><div class="body mono" style="font-size:11px">${esc(r.error)}</div></div>`; return; }
  const p = r.plan || {}, c = r.cost || {};
  const claims = [...(r.claims||[]), ...(r.dropped_claims||[])];

  const pre = (r.policy||{}).preflight || r.policy || {};
  const post = (r.policy||{}).postflight || {};

  let h = `<div class="answer">
    <span class="status ${esc(r.status)}">${esc((r.status||'').replace(/_/g,' '))}</span>
    <div class="body">${esc(r.answer)}</div>`;

  if(pre.decision){
    h += `<div class="gate ${esc(pre.decision)}">
       <span class="k">EU AI Act · ${esc(pre.decision.replace(/_/g,' '))}</span>
       <span class="d">${esc(pre.reason)}${pre.risk_tier? ' · risk tier: '+esc(pre.risk_tier):''}</span></div>`;
    if((pre.articles||[]).length) h += `<div class="arts">${pre.articles.map(a=>`<span>${esc(a)}</span>`).join('')}</div>`;
    (post.flags||[]).forEach(f => {
      h += `<div class="note ${f.severity==='blocking'?'bad':(f.severity==='review'?'warn':'ok')}">
        <b>${esc(f.flag.replace(/_/g,' '))}</b>${esc(f.detail)}</div>`;
    });
  }

  if(r.inconsistency) h += `<div class="note bad"><b>inconsistency detected</b>${esc(r.inconsistency)}</div>`;
  if(r.injection_noticed) h += `<div class="note warn"><b>prompt-injection attempt in document content</b>${esc(r.injection_noticed)}</div>`;
  if(r.status==='abstained' && r.missing) h += `<div class="note warn"><b>what was missing</b>${esc(r.missing)}</div>`;
  if(r.escalation) h += `<div class="note warn"><b>escalated to human review</b>${esc(r.escalation.note)}${r.escalation.target? ' — '+esc(r.escalation.target.why)+' in '+esc(r.escalation.target.doc_id):''}</div>`;

  if(claims.length){
    h += `<h2 class="t" style="margin-top:16px">Claims — click to see the pixels</h2>`;
    h += claims.map((cl,i) => `
      <div class="claim ${cl.grounded===false?'drop':''}" data-i="${i}">
        <div class="tx">${cl.grounded===false?'⚠︎ ':''}${esc(cl.text)}</div>
        ${cl.quote? `<div class="q2">“${esc(cl.quote)}”</div>`:''}
        ${cl.computed_value!=null? `<div class="cite">calculator: ${esc(cl.arithmetic)} = ${esc(cl.computed_value)}</div>`:''}
        <div class="cite">${esc(cl.doc_id)} · ${(cl.citations||[]).length} cited region${(cl.citations||[]).length===1?'':'s'}</div>
        ${cl.grounded===false? `<div class="vr">dropped by verifier: ${esc(cl.verifier_reason)}</div>`:''}
      </div>`).join('');
  }

  const steps = (r.trace||[]).map(t => `<span>${esc(t.step)} <b>${t.ms}ms</b></span>`).join('');
  const tierNote = (r.complexity && r.complexity_rated && r.complexity !== r.complexity_rated)
    ? ` <span style="color:var(--warn)">(floored from ${esc(r.complexity_rated)})</span>` : '';
  h += `<h2 class="t" style="margin-top:16px">Trace — the compliance artifact</h2>
    <div class="muted"><b style="color:var(--a2)">${esc(p.intent||'?')}</b> · ${esc(p.reasoning||'')}</div>
    <div class="trace">${steps}</div>
    <div class="trace"><span>complexity <b>${esc(r.complexity||'-')}</b>${tierNote}</span>
      <span>synth model <b>${esc((r.models||{}).synthesizer||'-').replace('claude-','')}</b></span>
      <span>verifier <b>${esc((r.verifier||{}).verdict||'-')}</b></span>
      <span>total <b>${r.elapsed_ms}ms</b></span>
      <span>calls <b>${c.calls||0}</b></span>
      <span>tokens <b>${(c.input_tokens||0)+(c.output_tokens||0)}</b></span>
      <span>cost <b>$${Number(c.usd||0).toFixed(4)}</b></span></div>`;
  h += `</div>`;
  $('#out').innerHTML = h;

  $('#out').querySelectorAll('.claim').forEach(el => el.onclick = () => {
    $('#out').querySelectorAll('.claim').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    showEvidence(claims[+el.dataset.i]);
  });

  if(r.pixel_reread && r.pixel_reread.length) showReread(r.pixel_reread);
  else if(claims.length) { $('#out').querySelector('.claim').classList.add('sel'); showEvidence(claims[0]); }
  else showRetrieved(r);
  loadCross();
}

// ---------------------------------------------------------------- evidence ---
function highlight(image, bbox, label){
  const [x0,y0,x1,y1] = bbox.map(v=>v/10);   // 0..1000 -> percent
  return `<div class="caption">${esc(label)}</div>
    <div class="viewer">
      <img src="/page/${esc(image)}" alt="">
      <div class="hl" style="left:${x0}%;top:${y0}%;width:${Math.max(0.6,x1-x0)}%;height:${Math.max(0.6,y1-y0)}%"></div>
    </div>`;
}

function showEvidence(claim){
  if(!claim) return;
  const cits = claim.citations || [];
  if(!cits.length){ $('#ev').innerHTML = `<div class="note warn"><b>no citable region</b>This claim carried no resolvable bounding box, which is exactly what the verifier gate is for.</div>`; return; }
  $('#ev').innerHTML = cits.map(c =>
    `<div style="margin-bottom:14px">
       ${highlight(c.image, c.bbox, `${c.doc_name||c.doc_id} · page ${c.page} · block ${c.block_id}`)}
       <div class="muted" style="margin-top:6px;font-size:11.5px">${esc(c.text).slice(0,420)}</div>
     </div>`).join('');
}

function showReread(rr){
  $('#ev').innerHTML = `<div class="note ok"><b>escalation: pixel re-read</b>The answer depended on a detail the cheap pass was not confident about, so the exact region was cropped out of the page and read again with a stronger model.</div>`
    + rr.map(x => `<div style="margin-top:12px">
        <div class="caption">${esc(x.doc_id)} — ${esc(x.reason)}</div>
        <div class="crop"><img src="/crop/${esc(x.crop)}" alt=""></div>
        <div class="muted" style="font-size:11.5px">${esc(x.reading).slice(0,700)}</div>
      </div>`).join('');
}

function showRetrieved(r){
  const b = (r.evidence||{}).blocks || [];
  if(!b.length){ $('#ev').innerHTML = '<div class="muted">No evidence was retrieved — which is why the system declined to answer.</div>'; return; }
  $('#ev').innerHTML = `<div class="caption">Retrieved but not sufficient to ground an answer</div>`
    + b.slice(0,4).map(x => `<div style="margin-bottom:12px">${highlight(DOCS.find(d=>d.doc_id===x.doc_id)?.image||'', x.bbox||[0,0,10,10], `${esc(x.doc_id)} · block ${esc(x.block_id)} · score ${x.score}`)}</div>`).join('');
}

async function showDocument(id){
  const rec = await (await fetch('/api/document/'+encodeURIComponent(id))).json();
  if(rec.error) return;
  const f = rec.fields||{}, v = rec.validations||[];
  const rows = Object.entries(f).map(([k,x])=>{
    const cf = x.confidence==null?'':(x.confidence>=.9?'cf':x.confidence>=.75?'cf low':'cf bad');
    return `<tr><td>${esc(k)}</td><td class="v">${esc(x.value===null?'—':x.value)}
      ${x.confidence!=null?`<span class="${cf}" style="font-size:10px"> ${(x.confidence*100).toFixed(0)}%</span>`:''}</td></tr>`;
  }).join('');
  const bad = v.filter(x=>!x.ok);
  $('#ev').innerHTML = `
    <div class="caption">${esc(rec.name)} · ${esc(rec.doc_type)} · classified by ${esc(rec.classified_by)}</div>
    <div class="viewer"><img src="/page/${esc(rec.image)}" alt=""></div>
    ${rec.visual_notes?`<div class="note ok" style="margin-top:9px"><b>what an OCR-only pipeline would lose</b>${esc(rec.visual_notes)}</div>`:''}
    <h2 class="t" style="margin-top:16px">Extracted fields</h2>
    <table class="kv">${rows}</table>
    <h2 class="t" style="margin-top:16px">Deterministic validators</h2>
    ${v.length? v.map(x=>`<div class="note ${x.ok?'ok':(x.severity==='review'?'warn':'bad')}" style="font-size:11.5px">
        <b>${x.ok?'pass':'fail'} · ${esc(x.check)}</b>${esc(x.detail)}</div>`).join('')
      : '<div class="muted">—</div>'}
    ${bad.length?'':'<div class="muted" style="margin-top:6px">All rules passed.</div>'}`;
}

// ?q=... deep-links a question, so a demo can be driven straight from the URL.
loadDocs().then(loadCross).then(() => {
  const q = new URLSearchParams(location.search).get('q');
  if(q){ $('#q').value = q; ask(); }
});
setInterval(loadDocs, 15000);
</script>
</body>
</html>
